<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>StewardPro Offline</title>
		<style>
			:root {
				color-scheme: light;
				--canvas: #f8f4e8;
				--ink: #173337;
				--muted: #5a6f73;
				--brand: #0d5c63;
				--accent: #cea75d;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				font-family: system-ui, sans-serif;
				background:
					radial-gradient(circle at top, rgba(206, 167, 93, 0.16), transparent 30%),
					linear-gradient(180deg, #fffdf7, var(--canvas));
				color: var(--ink);
			}

			main {
				width: min(32rem, 100%);
				padding: 2rem;
				border-radius: 1.5rem;
				background: rgba(255, 255, 255, 0.76);
				border: 1px solid rgba(13, 92, 99, 0.12);
				box-shadow: 0 20px 45px rgba(20, 40, 42, 0.12);
				text-align: center;
			}

			img {
				width: 5rem;
				height: 5rem;
				border-radius: 1.25rem;
			}

			h1 {
				margin: 1rem 0 0.75rem;
				font-size: clamp(1.6rem, 3vw, 2rem);
			}

			p {
				margin: 0 auto;
				max-width: 28rem;
				font-size: 1rem;
				line-height: 1.6;
				color: var(--muted);
			}

			a {
				display: inline-block;
				margin-top: 1.25rem;
				padding: 0.8rem 1rem;
				border-radius: 999px;
				background: var(--brand);
				color: #fff;
				text-decoration: none;
				font-weight: 600;
			}

			small {
				display: block;
				margin-top: 0.9rem;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/assets/stewardpro/pwa/icons/stewardpro-icon-192.png" alt="StewardPro icon">
			<h1>StewardPro is offline</h1>
			<p>
				Your last-opened assets are available, but live desk data needs a working connection.
				Reconnect and reopen the app to continue with members, finance, and Sabbath School records.
			</p>
			<a href="/app/church-administration">Try again</a>
			<small>Offline support caches the app shell, not private API responses.</small>
		</main>
	</body>
</html>
